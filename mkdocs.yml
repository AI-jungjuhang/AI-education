      - "1.1 챗봇이 하는 일":
        - "챗봇은 '다음 말'을 맞히는 기계": part1/ch01/next-word.md
        - "글자를 '토큰'이라는 조각으로 쪼개 읽는다": part1/ch01/tokens.md
        - "그럴듯하지만 틀릴 수 있다: 환각": part1/ch01/hallucination.md
    - "2장 질문을 잘하는 법":
