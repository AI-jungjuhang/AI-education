site_name: 열 살도 이해하는 AI
site_description: 처음 쓰는 사람부터 원리로 쓰는 사람까지, AI를 기초에서 심화까지 다루는 한국어 교과서
site_url: https://sehoon3554-ctrl.github.io/AI-education/
repo_url: https://github.com/sehoon3554-ctrl/AI-education
theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: 다크 모드}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: 라이트 모드}
extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - attr_list
  - pymdownx.mark
  - md_in_html
  - toc: {permalink: true}
nav:
  - 홈: index.md
  - "I 처음 쓰는 AI":
    - part1/index.md
    - "1장 AI 챗봇은 뭘 하는 기계일까":
      - part1/ch01/index.md
      - "1.1 챗봇이 하는 일":
        - "챗봇은 '다음 말'을 맞히는 기계": part1/ch01/next-word.md
        - "글자를 '토큰'이라는 조각으로 쪼개 읽는다": part1/ch01/tokens.md
        - "그럴듯하지만 틀릴 수 있다: 환각": part1/ch01/hallucination.md
    - "2장 질문을 잘하는 법":
      - part1/ch02/index.md
      - "2.1 질문의 기본기":
        - "맥락을 주면 답이 달라진다": part1/ch02/context.md
        - "역할, 형식, 예시를 정해 준다": part1/ch02/role-format.md
        - "구체적으로 쓰되 한 번에 하나씩": part1/ch02/specific.md
      - "2.2 대화로 다듬기":
        - "고쳐 달라고 말하는 법": part1/ch02/iterate.md
        - "새 대화가 나을 때": part1/ch02/fresh-start.md
        - "나만의 질문 틀 만들기": part1/ch02/templates.md
    - "3장 믿어도 될 때와 안 될 때":
      - part1/ch03/index.md
      - "3.1 검증하는 습관":
        - "출처 확인하는 법": part1/ch03/check-sources.md
        - "숫자와 인용 대조하기": part1/ch03/check-numbers.md
        - "두 번째 의견 구하기": part1/ch03/second-opinion.md
    - "4장 어떤 AI를 고를까":
      - part1/ch04/index.md
  - "II 일에 붙이기":
    - part2/index.md
    - "5장 글쓰기에 붙이기":
      - part2/ch05/index.md
    - "6장 조사와 공부에 붙이기":
      - part2/ch06/index.md
    - "7장 정리와 숫자에 붙이기":
      - part2/ch07/index.md
    - "8장 일하는 방식 만들기":
      - part2/ch08/index.md
  - "III 원리 한 스푼":
    - part3/index.md
    - "9장 AI는 어떻게 배울까":
      - part3/ch09/index.md
    - "10장 말이 숫자로 바뀌는 방법":
      - part3/ch10/index.md
    - "11장 어텐션":
      - part3/ch11/index.md
    - "12장 확률로 문장 만들기":
      - part3/ch12/index.md
  - "IV 도구와 에이전트":
    - part4/index.md
    - "13장 도구를 쓰는 AI":
      - part4/ch13/index.md
    - "14장 에이전트":
      - part4/ch14/index.md
    - "15장 에이전트 만들어 보기":
