    - "16장 모델 속을 들여다보기 ★":
      - part5/ch16/index.md
    - "17장 학습의 심화 ★":
      - part5/ch17/index.md
    - "18장 평가와 한계 ★":
      - part5/ch18/index.md
    - "19장 대가들은 어디를 보고 있나 ★":
      - part5/ch19/index.md
  - "부록":
