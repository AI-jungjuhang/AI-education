# English edition: single source of truth for the table of contents and progress.
# Same structure and slugs as book.yml (Korean). Written fresh in English, not translated.
# After writing a page, set done: true and run:
#   python3 tools/build_book.py --book book-en.yml --config mkdocs-en.yml --docs docs-en
labels:
  home: Home
  chapter: Ch. {n}
  chapter_title: Ch. {n} {t}
  written: '{k}/{n} written'
  read: '{m} min read'
  soon: Coming soon
  new: New
  th: '| Part | What you get | Progress |'
  done_all: Done ({n})
  wrote: '**{k}/{n} written**'
  total: '{done} of {total} pages written so far.'
parts:
- id: 1
  title: I Your First AI
  blurb: For people using an AI chatbot for the first time. Learn what a chatbot actually does, how to ask, and when to trust it.
  chapters:
  - num: 1
    title: What Does a Chatbot Actually Do?
    blurb: Three steps to see how a chatbot builds an answer, and why it is sometimes wrong.
    sections:
    - num: '1.1'
      title: What a chatbot does
      pages:
      - {slug: next-word, title: A chatbot guesses the next word, min: 5, done: true}
      - {slug: tokens, title: It reads text in small pieces called tokens, min: 5, done: true}
      - {slug: hallucination, title: 'Sounds right, can be wrong: hallucination', min: 6, done: true}
  - num: 2
    title: How to Ask Well
    blurb: The same chatbot gives different answers to different questions. Learn asking tips that come straight from how it works.
    sections:
    - num: '2.1'
      title: The basics of asking
      pages:
      - {slug: context, title: Give it context and the answer changes, min: 5, done: true}
      - {slug: role-format, title: 'Set the role, the format, and an example', min: 5, done: true}
      - {slug: specific, title: 'Be specific, one thing at a time', min: 5, done: true}
    - num: '2.2'
      title: Improving it as you talk
      pages:
      - {slug: iterate, title: How to ask for changes, min: 5, done: true}
      - {slug: fresh-start, title: When a new chat works better, min: 4, done: true}
      - {slug: templates, title: Make your own question templates, min: 5, done: true}
  - num: 3
    title: When to Trust It, When Not To
    blurb: Now you know it can be wrong. Build the habit of checking, and learn to use it safely.
    sections:
    - num: '3.1'
      title: The checking habit
      pages:
      - {slug: check-sources, title: How to check sources, min: 5, done: true}
      - {slug: check-numbers, title: Check numbers and quotes, min: 5, done: true}
      - {slug: second-opinion, title: Get a second opinion, min: 5, done: true}
    - num: '3.2'
      title: Using it safely
      pages:
      - {slug: privacy, title: Personal and sensitive information, min: 5, done: true}
      - {slug: copyright, title: Copyright and plagiarism, min: 5, done: true}
      - {slug: bias, title: Spotting bias and limits, min: 5, done: true}
  - num: 4
    title: Which AI Should You Pick?
    blurb: There are so many AI tools it gets confusing. Sort them into kinds and pick the right one for your job.
    sections:
    - num: '4.1'
      title: Kinds and how to choose
      pages:
      - {slug: kinds, title: 'Chat, search, image, voice: the kinds of AI', min: 5, done: true}
      - {slug: free-paid, title: 'What changes between free and paid?', min: 5, done: true}
      - {slug: choose, title: Pick the AI that fits your work, min: 5, done: true}
- id: 2
  title: II Put AI to Work
  blurb: How to use AI for writing, research, and getting organized. Practical tips you can use right away.
  chapters:
  - num: 5
    title: AI for Writing
    blurb: Using AI for first drafts, rewrites, and summaries.
    sections:
    - num: '5.1'
      title: Your writing helper
      pages:
      - {slug: first-draft, title: Get a first draft, min: 5, done: true}
      - {slug: rewrite, title: Rewrite and change the tone, min: 5, done: true}
      - {slug: summarize, title: Summarize, min: 5, done: true}
  - num: 6
    title: AI for Research and Study
    blurb: Using AI to get your bearings in a new field, read long documents, and study.
    sections:
    - num: '6.1'
      title: Look things up and learn
      pages:
      - {slug: quick-intro, title: Get to know a new field fast, min: 5, done: true}
      - {slug: long-docs, title: Read and sort out long documents, min: 5, done: true}
      - {slug: tutor, title: Use it as a study buddy, min: 5, done: true}
  - num: 7
    title: AI for Notes and Numbers
    blurb: Using AI for meeting notes, tables, and calculations.
    sections:
    - num: '7.1'
      title: Documents and tables
      pages:
      - {slug: meeting-notes, title: Meeting notes and emails, min: 5, done: true}
      - {slug: tables, title: Help with tables and spreadsheet formulas, min: 5, done: true}
      - {slug: math-caution, title: Be careful when it does math, min: 5, done: true}
  - num: 8
    title: Make It Part of How You Work
    blurb: Don't use it once and stop. Turn it into a way of working for you and your team.
    sections:
    - num: '8.1'
      title: Your own routine
      pages:
      - {slug: prompt-library, title: Keep your favorite prompts, min: 5, done: true}
      - {slug: rollout-check, title: A checklist before using it at work, min: 5, done: true}
      - {slug: team-rules, title: Rules your team agrees on, min: 5, done: true}
- id: 3
  title: III A Spoonful of How It Works
  blurb: No hard math. Take a spoonful at a time of what happens inside a chatbot.
  chapters:
  - num: 9
    title: How Does AI Learn?
    blurb: Reading and copying, learning from people, and why size matters.
    sections:
    - num: '9.1'
      title: Three stages of learning
      pages:
      - {slug: pretraining, title: 'Read and imitate: pretraining', min: 6, done: true}
      - {slug: tuning, title: 'Learn from people: fine-tuning and feedback', min: 6, done: true}
      - {slug: scale, title: 'Why size matters: parameters', min: 5, done: true}
  - num: 10
    title: How Words Become Numbers
    blurb: How tokens become lists of numbers, and how meaning becomes distance.
    sections:
    - num: '10.1'
      title: Embeddings
      pages:
      - {slug: tokens-to-vectors, title: Tokens become lists of numbers, min: 6, done: true}
      - {slug: closeness, title: Similar meanings sit close together, min: 5, done: true}
      - {slug: context-meaning, title: Meaning changes with context, min: 5, done: true}
  - num: 11
    title: Attention
    blurb: How a chatbot decides which parts of the text to look at.
    sections:
    - num: '11.1'
      title: Where to look
      pages:
      - {slug: attention-idea, title: 'Attention: picking out what matters', min: 6, done: true}
      - {slug: transformer-layer, title: What one transformer layer looks like, min: 6, done: true}
      - {slug: context-window, title: 'The context window: how much it sees at once', min: 5, done: true}
  - num: 12
    title: Building Sentences with Probability
    blurb: How the next word is drawn from a score sheet, and why answers change every time.
    sections:
    - num: '12.1'
      title: How it chooses
      pages:
      - {slug: temperature, title: 'Temperature: how adventurous to be', min: 5, done: true}
      - {slug: sampling, title: 'Sampling: how it draws', min: 5, done: false}
      - {slug: long-answer, title: How a long answer keeps going, min: 5, done: false}
