# English edition. nav is generated from book-en.yml by tools/build_book.py (see book-en.yml).
site_name: AI, Start to Finish
site_description: The AI textbook a 10-year-old can follow. From your first chat to using AI from first principles, written in plain English.
site_url: https://ai-jungjuhang.github.io/AI-education/en/
docs_dir: docs-en
theme:
  name: material
  logo: assets/potato-logo.svg
  favicon: assets/potato-logo.svg
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/extra.css
extra_javascript:
  - javascripts/potato.js
  - javascripts/reveal.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - attr_list
  - pymdownx.mark: {smart_mark: false}
  - md_in_html
  - toc: {permalink: true}
nav:
  - Home: index.md
  - "I Your First AI":
    - part1/index.md
    - "Ch. 1 What Does a Chatbot Actually Do?":
      - part1/ch01/index.md
      - "1.1 What a chatbot does":
        - "A chatbot guesses the next word": part1/ch01/next-word.md
        - "It reads text in small pieces called tokens": part1/ch01/tokens.md
        - "Sounds right, can be wrong: hallucination": part1/ch01/hallucination.md
    - "Ch. 2 How to Ask Well":
      - part1/ch02/index.md
      - "2.1 The basics of asking":
        - "Give it context and the answer changes": part1/ch02/context.md
        - "Set the role, the format, and an example": part1/ch02/role-format.md
        - "Be specific, one thing at a time": part1/ch02/specific.md
      - "2.2 Improving it as you talk":
        - "How to ask for changes": part1/ch02/iterate.md
        - "When a new chat works better": part1/ch02/fresh-start.md
        - "Make your own question templates": part1/ch02/templates.md
    - "Ch. 3 When to Trust It, When Not To":
