      pages:
      - {slug: prompt-library, title: 자주 쓰는 질문 모아 두기, min: 5, done: true}
      - {slug: rollout-check, title: 일에 적용하기 전 체크리스트, min: 5, done: true}
      - {slug: team-rules, title: 팀에서 정하는 규칙, min: 5, done: true}
