# 책 전체 목차와 진행 상태의 단일 원본. 페이지를 쓰면 done: true로 바꾸고 `python3 tools/build_book.py`를 실행한다.
# 메뉴(mkdocs.yml의 nav), 부/장 안내 페이지, 홈 진행표가 이 파일에서 자동으로 만들어진다.
parts:
- id: 1
  title: I 처음 쓰는 AI
  blurb: AI 챗봇을 처음 쓰는 사람을 위한 부예요. 챗봇이 뭘 하는 기계인지 알고, 질문하는 법과 믿는 법을 익혀요.
  chapters:
  - num: 1
    title: AI 챗봇은 뭘 하는 기계일까
    blurb: 챗봇이 어떻게 답을 만드는지, 그리고 왜 틀리기도 하는지를 세 걸음으로 알아봐요.
    sections:
    - num: '1.1'
      title: 챗봇이 하는 일
      pages:
      - {slug: next-word, title: 챗봇은 '다음 말'을 맞히는 기계, min: 5, done: true}
      - {slug: tokens, title: 글자를 '토큰'이라는 조각으로 쪼개 읽는다, min: 5, done: true}
      - {slug: hallucination, title: '그럴듯하지만 틀릴 수 있다: 환각', min: 6, done: true}
  - num: 2
    title: 질문을 잘하는 법
    blurb: 같은 챗봇도 질문에 따라 답이 달라져요. 원리에서 나온 질문 요령을 익혀요.
    sections:
    - num: '2.1'
      title: 질문의 기본기
      pages:
      - {slug: context, title: 맥락을 주면 답이 달라진다, min: 5, done: true}
      - {slug: role-format, title: '역할, 형식, 예시를 정해 준다', min: 5, done: true}
      - {slug: specific, title: 구체적으로 쓰되 한 번에 하나씩, min: 5, done: true}
    - num: '2.2'
      title: 대화로 다듬기
      pages:
      - {slug: iterate, title: 고쳐 달라고 말하는 법, min: 5, done: true}
      - {slug: fresh-start, title: 새 대화가 나을 때, min: 4, done: true}
      - {slug: templates, title: 나만의 질문 틀 만들기, min: 5, done: true}
  - num: 3
    title: 믿어도 될 때와 안 될 때
    blurb: 틀릴 수 있다는 걸 알았으니, 확인하는 습관과 안전하게 쓰는 법을 익혀요.
    sections:
    - num: '3.1'
      title: 검증하는 습관
      pages:
      - {slug: check-sources, title: 출처 확인하는 법, min: 5, done: true}
      - {slug: check-numbers, title: 숫자와 인용 대조하기, min: 5, done: true}
      - {slug: second-opinion, title: 두 번째 의견 구하기, min: 5, done: true}
    - num: '3.2'
      title: 안전하게 쓰기
      pages:
      - {slug: privacy, title: 개인정보와 민감한 자료, min: 5, done: true}
      - {slug: copyright, title: 저작권과 표절, min: 5, done: true}
      - {slug: bias, title: 편향과 한계 알아보기, min: 5, done: true}
  - num: 4
    title: 어떤 AI를 고를까
    blurb: 종류가 많아서 헷갈리는 AI를 나누어 보고, 내 일에 맞게 고르는 기준을 세워요.
    sections:
    - num: '4.1'
      title: 종류와 고르는 법
      pages:
      - {slug: kinds, title: '챗봇, 검색형, 이미지, 음성: 종류 나누기', min: 5, done: true}
      - {slug: free-paid, title: 무료와 유료는 뭐가 다를까, min: 5, done: true}
      - {slug: choose, title: 내 일에 맞는 AI 고르기, min: 5, done: true}
- id: 2
  title: II 일에 붙이기
  blurb: 글쓰기, 조사, 정리 같은 일에 AI를 붙이는 방법이에요. 바로 써먹는 요령이 중심이에요.
  chapters:
  - num: 5
    title: 글쓰기에 붙이기
    blurb: 초안, 고쳐 쓰기, 요약에 AI를 쓰는 법이에요.
    sections:
    - num: '5.1'
      title: 글쓰기 도우미
      pages:
      - {slug: first-draft, title: 초안 만들기, min: 5, done: true}
      - {slug: rewrite, title: 고쳐 쓰기와 말투 바꾸기, min: 5, done: true}
      - {slug: summarize, title: 요약하기, min: 5, done: true}
  - num: 6
    title: 조사와 공부에 붙이기
    blurb: 낯선 분야를 파악하고, 긴 자료를 읽고, 공부하는 데 AI를 쓰는 법이에요.
    sections:
    - num: '6.1'
      title: 알아보고 배우기
      pages:
      - {slug: quick-intro, title: 낯선 분야 빠르게 파악하기, min: 5, done: true}
      - {slug: long-docs, title: 긴 자료 읽고 정리하기, min: 5, done: true}
      - {slug: tutor, title: 공부 도우미로 쓰기, min: 5, done: true}
  - num: 7
    title: 정리와 숫자에 붙이기
    blurb: 회의록, 표, 계산처럼 정리가 필요한 일에 AI를 쓰는 법이에요.
    sections:
    - num: '7.1'
      title: 문서와 표
      pages:
      - {slug: meeting-notes, title: 회의록과 메일 정리, min: 5, done: true}
      - {slug: tables, title: 표와 엑셀 함수 도움받기, min: 5, done: true}
      - {slug: math-caution, title: 계산을 맡길 때 조심할 것, min: 5, done: true}
  - num: 8
    title: 일하는 방식 만들기
    blurb: 한 번 쓰고 끝내지 않고, 나와 팀의 일하는 방식으로 만드는 법이에요.
    sections:
    - num: '8.1'
      title: 나만의 루틴
      pages:
      - {slug: prompt-library, title: 자주 쓰는 질문 모아 두기, min: 5, done: true}
      - {slug: rollout-check, title: 일에 적용하기 전 체크리스트, min: 5, done: true}
      - {slug: team-rules, title: 팀에서 정하는 규칙, min: 5, done: true}
- id: 3
  title: III 원리 한 스푼
  blurb: 어려운 수식 없이, 챗봇 안에서 일어나는 일을 한 스푼씩 맛봐요.
  chapters:
  - num: 9
    title: AI는 어떻게 배울까
    blurb: 읽고 따라 하기, 사람에게 배우기, 크기의 의미를 알아봐요.
    sections:
    - num: '9.1'
      title: 학습의 세 단계
      pages:
      - {slug: pretraining, title: '읽고 따라 하기: 사전학습', min: 6, done: true}
      - {slug: tuning, title: '사람에게 배우기: 미세조정과 피드백', min: 6, done: true}
      - {slug: scale, title: '크기가 왜 중요할까: 파라미터', min: 5, done: true}
  - num: 10
    title: 말이 숫자로 바뀌는 방법
    blurb: 토큰이 숫자 묶음이 되고, 뜻이 거리가 되는 과정을 알아봐요.
    sections:
    - num: '10.1'
      title: 임베딩
      pages:
      - {slug: tokens-to-vectors, title: 토큰이 숫자 묶음이 된다, min: 6, done: true}
      - {slug: closeness, title: 비슷한 뜻은 가까이 있다, min: 5, done: true}
      - {slug: context-meaning, title: 문맥에 따라 뜻이 달라진다, min: 5, done: true}
  - num: 11
    title: 어텐션
    blurb: 챗봇이 글의 어디를 볼지 정하는 방법이에요.
    sections:
    - num: '11.1'
      title: 어디를 볼까
      pages:
      - {slug: attention-idea, title: '어텐션: 중요한 곳을 골라 본다', min: 6, done: true}
      - {slug: transformer-layer, title: 트랜스포머 한 층의 모양, min: 6, done: true}
      - {slug: context-window, title: '컨텍스트 창: 한 번에 보는 범위', min: 5, done: true}
  - num: 12
    title: 확률로 문장 만들기
    blurb: 점수표에서 다음 말을 뽑는 방법과, 답이 매번 다른 이유를 알아봐요.
    sections:
    - num: '12.1'
      title: 고르는 방법
      pages:
      - {slug: temperature, title: '온도: 얼마나 모험할까', min: 5, done: true}
      - {slug: sampling, title: '샘플링: 뽑는 방법', min: 5, done: true}
      - {slug: long-answer, title: 긴 답이 이어지는 과정, min: 5, done: true}
- id: 4
  title: IV 도구와 에이전트
  blurb: 검색, 파일, 도구를 쓰고 스스로 일하는 AI를 알아봐요.
  chapters:
  - num: 13
    title: 도구를 쓰는 AI
    blurb: 챗봇에 검색과 파일과 도구를 연결하면 달라지는 것들이에요.
    sections:
    - num: '13.1'
      title: 검색, 파일, 연결
      pages:
      - {slug: search-rag, title: 검색을 붙이면 달라지는 것, min: 6, done: true}
      - {slug: files-code, title: 파일을 읽고 코드를 실행하는 AI, min: 5, done: true}
      - {slug: connectors, title: '도구를 연결하는 표준: MCP', min: 5, done: true}
  - num: 14
    title: 에이전트
    blurb: 스스로 계획하고 행동하는 AI가 무엇이고 어떻게 실패하는지 알아봐요.
    sections:
    - num: '14.1'
      title: 스스로 일하는 AI
      pages:
      - {slug: what-agent, title: 에이전트란 무엇일까, min: 6, done: true}
      - {slug: loop, title: '계획하고, 행동하고, 확인한다', min: 6, done: true}
      - {slug: failures, title: 에이전트가 실패하는 모습과 안전장치, min: 6, done: true}
  - num: 15
    title: 에이전트 만들어 보기
    blurb: 지시문, 도구, 평가를 중심으로 에이전트 설계를 맛봐요.
    sections:
    - num: '15.1'
      title: 설계 맛보기
      pages:
      - {slug: instructions, title: 좋은 지시문 쓰기, min: 6, done: true}
      - {slug: tool-design, title: 도구를 잘 설계하기, min: 6, done: true}
      - {slug: evaluate, title: 평가하고 고치기, min: 6, done: true}
- id: 5
  title: V 원리로 쓰기 ★
  blurb: 심화예요. 모델 속을 들여다보고, 학습과 평가의 깊은 이야기를 읽고, 이 분야를 만든 사람들의 생각을 따라가요.
  chapters:
  - num: 16
    title: 모델 속을 들여다보기 ★
    blurb: 해석 가능성 연구가 알아낸 것들이에요.
    sections:
    - num: '16.1'
      title: 해석 가능성
      pages:
      - {slug: interp-intro, title: 왜 모델 속을 봐야 할까, min: 7, done: true}
      - {slug: features, title: '특징: 모델 안의 개념들', min: 7, done: true}
      - {slug: circuits, title: '회로: 생각의 길 따라가기', min: 7, done: true}
  - num: 17
    title: 학습의 심화 ★
    blurb: 스케일링, 강화학습과 추론 모델, 정렬을 살펴봐요.
    sections:
    - num: '17.1'
      title: 더 깊은 학습
      pages:
      - {slug: scaling, title: '스케일링: 크게 만들면 좋아질까', min: 7, done: true}
      - {slug: rl-reasoning, title: 강화학습과 추론 모델, min: 7, done: true}
      - {slug: alignment, title: '정렬: 사람의 뜻에 맞추기', min: 7, done: true}
  - num: 18
    title: 평가와 한계 ★
    blurb: AI가 얼마나 잘하는지 재는 방법과 그 한계예요.
    sections:
    - num: '18.1'
      title: 얼마나 잘할까
      pages:
      - {slug: benchmarks, title: 벤치마크의 함정, min: 7, done: true}
      - {slug: eval-hallu, title: 환각은 어떻게 재나, min: 7, done: true}
      - {slug: risks, title: 안전과 위험을 보는 눈, min: 7, done: true}
  - num: 19
    title: 대가들은 어디를 보고 있나 ★
    blurb: 이 분야를 만든 사람들의 인터뷰와 강연에서 AI의 발전 방향과 통찰을 읽어요. 발언은 사실이 아니라 견해예요.
    sections:
    - num: '19.1'
      title: 인터뷰로 읽는 방향
      pages:
      - {slug: karpathy, title: Andrej Karpathy의 시선, min: 8, done: true}
      - {slug: altman, title: Sam Altman의 시선, min: 8, done: true}
      - {slug: hinton, title: Geoffrey Hinton의 시선, min: 8, done: true}
      - {slug: amodei, title: Dario Amodei의 시선, min: 8, done: true}
      - {slug: hassabis, title: Demis Hassabis의 시선, min: 8, done: true}
      - {slug: views-compare, title: '입장 비교: 어디서 갈릴까', min: 8, done: true}
- id: A
  title: 부록
  blurb: 용어, 질문 모음, 읽는 순서, 참고 자료예요.
  flat:
  - {slug: glossary, title: 용어집, min: 5, done: true}
  - {slug: prompt-bank, title: 질문 모음, min: 5, done: true}
  - {slug: reading-order, title: 읽는 순서 추천, min: 3, done: true}
  - {slug: references, title: 참고 자료 목록, min: 4, done: true}
