# 책 전체 목차와 진행 상태의 단일 원본. 페이지를 쓰면 done: true로 바꾸고 `python3 tools/build_book.py`를 실행한다.
# 메뉴(mkdocs.yml의 nav), 부/장 안내 페이지, 홈 진행표가 이 파일에서 자동으로 만들어진다.
parts:
- id: 1
  title: I 처음 쓰는 AI
  blurb: AI 챗봇을 처음 쓰는 사람을 위한 부예요. 챗봇이 뭘 하는 기계인지 알고, 질문하는 법과 믿는 법을 익혀요.
  chapters:
  - num: 1
    title: AI 챗봇은 뭘 하는 기계일까
    blurb: 챗봇이 어떻게 답을 만드는지, 그리고 왜 틀리기도 하는지를 세 걸음으로 알아봐요.
    sections:
    - num: '1.1'
      title: 챗봇이 하는 일
      pages:
      - {slug: next-word, title: 챗봇은 '다음 말'을 맞히는 기계, min: 5, done: true}
      - {slug: tokens, title: 글자를 '토큰'이라는 조각으로 쪼개 읽는다, min: 5, done: true}
      - {slug: hallucination, title: '그럴듯하지만 틀릴 수 있다: 환각', min: 6, done: true}
  - num: 2
    title: 질문을 잘하는 법
    blurb: 같은 챗봇도 질문에 따라 답이 달라져요. 원리에서 나온 질문 요령을 익혀요.
    sections:
    - num: '2.1'
      title: 질문의 기본기
      pages:
      - {slug: context, title: 맥락을 주면 답이 달라진다, min: 5, done: true}
      - {slug: role-format, title: '역할, 형식, 예시를 정해 준다', min: 5, done: true}
      - {slug: specific, title: 구체적으로 쓰되 한 번에 하나씩, min: 5, done: true}
    - num: '2.2'
      title: 대화로 다듬기
      pages:
      - {slug: iterate, title: 고쳐 달라고 말하는 법, min: 5, done: true}
      - {slug: fresh-start, title: 새 대화가 나을 때, min: 4, done: true}
      - {slug: templates, title: 나만의 질문 틀 만들기, min: 5, done: true}
  - num: 3
    title: 믿어도 될 때와 안 될 때
    blurb: 틀릴 수 있다는 걸 알았으니, 확인하는 습관과 안전하게 쓰는 법을 익혀요.
    sections:
    - num: '3.1'
      title: 검증하는 습관
      pages:
      - {slug: check-sources, title: 출처 확인하는 법, min: 5, done: true}
      - {slug: check-numbers, title: 숫자와 인용 대조하기, min: 5, done: true}
      - {slug: second-opinion, title: 두 번째 의견 구하기, min: 5, done: true}
    - num: '3.2'
      title: 안전하게 쓰기
      pages:
      - {slug: privacy, title: 개인정보와 민감한 자료, min: 5, done: true}
      - {slug: copyright, title: 저작권과 표절, min: 5, done: true}
      - {slug: bias, title: 편향과 한계 알아보기, min: 5, done: true}
  - num: 4
    title: 어떤 AI를 고를까
    blurb: 종류가 많아서 헷갈리는 AI를 나누어 보고, 내 일에 맞게 고르는 기준을 세워요.
    sections:
    - num: '4.1'
      title: 종류와 고르는 법
      pages:
      - {slug: kinds, title: '챗봇, 검색형, 이미지, 음성: 종류 나누기', min: 5, done: true}
      - {slug: free-paid, title: 무료와 유료는 뭐가 다를까, min: 5, done: true}
      - {slug: choose, title: 내 일에 맞는 AI 고르기, min: 5, done: true}
- id: 2
  title: II 일에 붙이기
  blurb: 글쓰기, 조사, 정리 같은 일에 AI를 붙이는 방법이에요. 바로 써먹는 요령이 중심이에요.
  chapters:
  - num: 5
    title: 글쓰기에 붙이기
    blurb: 초안, 고쳐 쓰기, 요약에 AI를 쓰는 법이에요.
    sections:
    - num: '5.1'
      title: 글쓰기 도우미
      pages:
      - {slug: first-draft, title: 초안 만들기, min: 5, done: true}
      - {slug: rewrite, title: 고쳐 쓰기와 말투 바꾸기, min: 5, done: true}
      - {slug: summarize, title: 요약하기, min: 5, done: true}
  - num: 6
    title: 조사와 공부에 붙이기
    blurb: 낯선 분야를 파악하고, 긴 자료를 읽고, 공부하는 데 AI를 쓰는 법이에요.
    sections:
    - num: '6.1'
      title: 알아보고 배우기
      pages:
      - {slug: quick-intro, title: 낯선 분야 빠르게 파악하기, min: 5, done: true}
      - {slug: long-docs, title: 긴 자료 읽고 정리하기, min: 5, done: true}
      - {slug: tutor, title: 공부 도우미로 쓰기, min: 5, done: true}
  - num: 7
    title: 정리와 숫자에 붙이기
    blurb: 회의록, 표, 계산처럼 정리가 필요한 일에 AI를 쓰는 법이에요.
    sections:
    - num: '7.1'
      title: 문서와 표
      pages:
      - {slug: meeting-notes, title: 회의록과 메일 정리, min: 5, done: true}
      - {slug: tables, title: 표와 엑셀 함수 도움받기, min: 5, done: true}
      - {slug: math-caution, title: 계산을 맡길 때 조심할 것, min: 5, done: true}
  - num: 8
    title: 일하는 방식 만들기
    blurb: 한 번 쓰고 끝내지 않고, 나와 팀의 일하는 방식으로 만드는 법이에요.
    sections:
    - num: '8.1'
